server {
    if ($host = www.libertywear.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = libertywear.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name libertywear.uz www.libertywear.uz;
    return 404; # managed by Certbot




}

